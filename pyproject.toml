[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"
[project]
name = "send-foia-log-requests"
version = "0.1.0"
requires-python = ">=3.11"
[project.scripts]
foia-requests = "foia_requests.__main__:main"
[tool.setuptools.packages.find]
include = ["foia_requests*"]
